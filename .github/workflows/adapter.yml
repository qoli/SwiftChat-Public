name: Adapter compatibility fixtures
on:
  push:
    paths: ['adapter/**', '.github/workflows/adapter.yml']
  pull_request:
    paths: ['adapter/**', '.github/workflows/adapter.yml']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test adapter/tests/*.test.cjs
